const scare=document.getElementById('scare');

function scarySound(){
  const audio = document.getElementById('prankAudio');
  audio.currentTime = 0;
  audio.loop = true;
  audio.play().catch(()=>{});
}

btn.addEventListener('click',()=>{
  scare.style.display='grid';
  scarySound();
  setTimeout(()=>{ scare.style.display='none'; },3600000);
});
</script>
</body>
</html>
